<header
  class="app-header sticky top-0 z-30 flex min-h-16 w-full items-center"
>
  <div class="flex w-full items-center justify-between gap-3 px-3 sm:px-4 lg:px-6">
    <div class="flex min-w-0 items-center gap-2">
      <button
        type="button"
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl text-gray-600 hover:bg-gray-100 hover:text-gray-900 lg:hidden dark:text-gray-300 dark:hover:bg-white/8 dark:hover:text-white"
        aria-controls="app-sidebar"
        :aria-expanded="sidebarToggle.toString()"
        :aria-label="sidebarToggle ? 'Close navigation' : 'Open navigation'"
        @click.stop="sidebarToggle = !sidebarToggle"
      >
        <svg
          x-show="!sidebarToggle"
          class="h-6 w-6"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-width="1.8" d="M4 7h16M4 12h16M4 17h16" />
        </svg>
        <svg
          x-cloak
          x-show="sidebarToggle"
          class="h-6 w-6"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-width="1.8" d="m6 6 12 12M18 6 6 18" />
        </svg>
      </button>

      <button
        type="button"
        class="hidden h-11 w-11 shrink-0 items-center justify-center rounded-xl text-gray-600 hover:bg-gray-100 hover:text-gray-900 lg:flex dark:text-gray-300 dark:hover:bg-white/8 dark:hover:text-white"
        aria-controls="app-sidebar"
        :aria-expanded="(!sidebarToggle).toString()"
        :aria-label="sidebarToggle ? 'Expand navigation' : 'Collapse navigation'"
        @click.stop="sidebarToggle = !sidebarToggle"
      >
        <svg
          class="h-5 w-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          aria-hidden="true"
        >
          <rect x="3.5" y="4" width="17" height="16" rx="2.5" stroke-width="1.7" />
          <path stroke-width="1.7" d="M9 4v16" />
        </svg>
      </button>

      <a
        href="dashboard.html"
        class="flex min-h-11 min-w-0 items-center gap-2 rounded-lg px-1 lg:hidden"
        aria-label="Serafina dashboard"
      >
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-[10px] bg-brand-500 text-white shadow-theme-xs" aria-hidden="true">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2.75c.5 4.66 2.59 6.75 7.25 7.25-4.66.5-6.75 2.59-7.25 7.25C11.5 12.59 9.41 10.5 4.75 10 9.41 9.5 11.5 7.41 12 2.75Z" />
            <circle cx="18.25" cy="17.75" r="2" />
          </svg>
        </span>
        <span class="truncate text-[17px] font-semibold tracking-[-0.02em] text-gray-900 dark:text-white">Serafina</span>
      </a>
    </div>

    <button
      type="button"
      class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-gray-200 bg-white/70 text-gray-600 shadow-theme-xs hover:bg-gray-100 hover:text-gray-900 dark:border-gray-700 dark:bg-gray-900/70 dark:text-gray-300 dark:hover:bg-gray-800 dark:hover:text-white"
      :aria-label="darkMode ? 'Use light appearance' : 'Use dark appearance'"
      :title="darkMode ? 'Use light appearance' : 'Use dark appearance'"
      :aria-pressed="Boolean(darkMode).toString()"
      @click="darkMode = !darkMode"
    >
      <svg
        class="hidden h-5 w-5 dark:block"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="3.5" stroke-width="1.7" />
        <path stroke-linecap="round" stroke-width="1.7" d="M12 2.5v2M12 19.5v2M21.5 12h-2M4.5 12h-2M18.72 5.28l-1.42 1.42M6.7 17.3l-1.42 1.42M18.72 18.72 17.3 17.3M6.7 6.7 5.28 5.28" />
      </svg>
      <svg
        class="h-5 w-5 dark:hidden"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z" />
      </svg>
    </button>
  </div>
</header>
